<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>نظام تقارير إدارة الأمن والسلامة</title>
<style>
:root{--navy:#0b2f57;--blue:#146cc0;--green:#198754;--bg:#f3f7fb;--gold:#c79a3b}
*{box-sizing:border-box} body{margin:0;font-family:Tahoma,Arial,sans-serif;background:var(--bg);color:#16283b}
header{background:linear-gradient(135deg,#082848,#114b82);color:#fff;padding:24px 16px;text-align:center;box-shadow:0 3px 12px #0003}
header h1{margin:0;font-size:24px}header p{margin:8px 0 0;color:#dcecff}
.container{max-width:1050px;margin:24px auto;padding:0 15px}.card{background:#fff;border-radius:18px;padding:22px;margin:16px 0;box-shadow:0 5px 20px #1232 0;box-shadow:0 5px 20px rgba(10,35,65,.10)}
h2{color:var(--navy);margin-top:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.supervisor{border:1px solid #dce6f0;border-radius:14px;padding:16px;background:#fff;cursor:pointer;text-align:center;transition:.2s}
.supervisor:hover{transform:translateY(-2px);box-shadow:0 6px 16px #1232;border-color:#5a9be0}.supervisor.active{border:2px solid var(--blue);background:#f2f8ff}
.sigbox{text-align:center;border:1px dashed #bfd1e3;border-radius:14px;padding:16px;margin:15px 0}.sigbox img{max-width:240px;max-height:95px;object-fit:contain}
label{font-weight:bold;display:block;margin-bottom:6px;color:#263c52}input,select,textarea{width:100%;padding:12px;border:1px solid #cfd9e5;border-radius:10px;font-size:16px;background:#fff}
textarea{min-height:130px}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
button{border:0;border-radius:10px;padding:13px 18px;color:#fff;background:var(--blue);font-size:16px;cursor:pointer}button.green{background:var(--green)}button.dark{background:var(--navy)}button.gray{background:#64748b}
.hidden{display:none}.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}.stat{padding:15px;border-radius:12px;background:#f7faff;border:1px solid #e1eaf4}.stat b{display:block;font-size:24px;color:var(--blue)}
#reportPreview{background:#fff;padding:28px}.reportHeader{text-align:center;border-bottom:3px solid var(--navy);padding-bottom:15px;margin-bottom:20px}.reportHeader h2{margin:5px}.meta{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:15px}.meta div,.line{padding:10px;background:#f7f9fc;border-radius:8px}
.notice{background:#eef7ff;border-right:4px solid var(--blue);padding:12px;border-radius:8px;color:#345}
footer{text-align:center;padding:25px;color:#667}
@media(max-width:600px){.formgrid,.meta{grid-template-columns:1fr}header h1{font-size:20px}.card{padding:16px}}
@media print{body{background:#fff}.no-print,header,footer,.chooser{display:none!important}.container{max-width:none;margin:0;padding:0}.card{box-shadow:none;margin:0;border-radius:0}.hidden{display:block!important}}
</style>
</head>
<body>
<header><h1>🛡️ إدارة الأمن والسلامة</h1><p>نظام التقارير الإلكتروني للمشرفين</p></header>
<div class="container">
<div class="card chooser">
<h2>اختيار المشرف</h2><p class="notice">اختر اسم المشرف وسيظهر توقيعه الإلكتروني تلقائيًا داخل التقرير.</p>
<div id="supervisors" class="grid"></div>
</div>

<div id="formCard" class="card hidden">
<h2>بيانات التقرير اليومي</h2>
<div class="sigbox"><div id="supName" style="font-weight:bold;font-size:19px"></div><div id="supRole" style="color:#667;margin:5px"></div><img id="signature" alt="التوقيع الإلكتروني للمشرف"><div style="color:#667;font-size:13px">التوقيع الإلكتروني المحفوظ للمشرف</div></div>
<div class="formgrid">
<div><label>التاريخ</label><input type="date" id="date"></div>
<div><label>الوردية</label><select id="shift"><option>صباحية</option><option>مسائية</option><option>ليلية</option></select></div>
<div><label>عدد الاعتداءات</label><input type="number" min="0" id="assaults" value="0"></div>
<div><label>عطل في التيار</label><input type="number" min="0" id="power" value="0"></div>
<div><label>عدد الزوار</label><input type="number" min="0" id="visitors" value="0"></div>
<div><label>تعطل المصاعد</label><input type="number" min="0" id="elevators" value="0"></div>
<div><label>محاضر المشرفين</label><input type="number" min="0" id="minutes" value="0"></div>
</div>
<div style="margin-top:14px"><label>الملاحظات والتفاصيل</label><textarea id="notes" placeholder="اكتب الملاحظات هنا..."></textarea></div>
<div class="actions no-print"><button class="green" onclick="saveReport()">💾 حفظ التقرير</button><button class="dark" onclick="showPreview()">🖨️ حفظ / طباعة PDF</button><button class="gray" onclick="resetForm()">↩️ تقرير جديد</button></div>
</div>

<div id="previewCard" class="card hidden">
<div id="reportPreview"></div>
<div class="actions no-print"><button class="dark" onclick="window.print()">🖨️ طباعة / حفظ PDF</button><button onclick="hidePreview()">← العودة للتعديل</button></div>
</div>

<div class="card no-print"><h2>📊 ملخص التقارير المحفوظة على هذا الجهاز</h2><div id="summary" class="summary"></div></div>
<footer>نظام تقارير إدارة الأمن والسلامة</footer>
</div>
<script>
const supervisors=[
{name:'سعود مسفر',role:'مشرف أمن',sig:'saud.png'},
{name:'عبدالرحمن عبدالله',role:'مشرف أمن',sig:'abdulrahman.png'},
{name:'عبدالعزيز سعيد',role:'مشرف أمن',sig:'abdulaziz.png'},
{name:'سلمان صالح',role:'مشرف أمن',sig:'salman.png'},
{name:'خالد صالح',role:'مشرف أمن',sig:'khaled.png'},
{name:'علي سعد',role:'رئيس المشرفين',sig:'ali.png'}
];
let selected=null;
const $=id=>document.getElementById(id);
$('date').value=new Date().toISOString().slice(0,10);
function renderSupervisors(){ $('supervisors').innerHTML=supervisors.map((s,i)=>`<div class="supervisor" onclick="selectSup(${i})"><b>${s.name}</b><br><small>${s.role}</small></div>`).join('') }
function selectSup(i){selected=supervisors[i];document.querySelectorAll('.supervisor').forEach((x,j)=>x.classList.toggle('active',j===i));$('formCard').classList.remove('hidden');$('supName').textContent='✍️ '+selected.name;$('supRole').textContent=selected.role;$('signature').src='signatures/'+selected.sig;$('signature').onerror=()=>{$('signature').style.display='none'};$('signature').style.display='inline-block';window.scrollTo({top:$('formCard').offsetTop-10,behavior:'smooth'});}
function data(){return {supervisor:selected,date:$('date').value,shift:$('shift').value,assaults:$('assaults').value,power:$('power').value,visitors:$('visitors').value,elevators:$('elevators').value,minutes:$('minutes').value,notes:$('notes').value,created:new Date().toLocaleString('ar-SA')}}
function saveReport(){if(!selected)return alert('اختر المشرف أولاً');let all=JSON.parse(localStorage.getItem('securityReports')||'[]');all.push(data());localStorage.setItem('securityReports',JSON.stringify(all));updateSummary();alert('تم حفظ التقرير بنجاح على هذا الجهاز.');}
function showPreview(){if(!selected)return alert('اختر المشرف أولاً');const d=data();$('reportPreview').innerHTML=`<div class="reportHeader"><h2>🛡️ إدارة الأمن والسلامة</h2><div>تقرير المشرف اليومي</div></div><div class="meta"><div><b>اسم المشرف:</b> ${d.supervisor.name}</div><div><b>الصفة:</b> ${d.supervisor.role}</div><div><b>التاريخ:</b> ${d.date}</div><div><b>الوردية:</b> ${d.shift}</div></div><div class="summary"><div class="stat"><span>الاعتداءات</span><b>${d.assaults}</b></div><div class="stat"><span>عطل التيار</span><b>${d.power}</b></div><div class="stat"><span>الزوار</span><b>${d.visitors}</b></div><div class="stat"><span>تعطل المصاعد</span><b>${d.elevators}</b></div><div class="stat"><span>محاضر المشرفين</span><b>${d.minutes}</b></div></div><h3 style="margin-top:22px">الملاحظات والتفاصيل</h3><div class="line">${d.notes?d.notes.replace(/\n/g,'<br>'):'لا توجد ملاحظات'}</div><div class="sigbox" style="margin-top:28px"><b>التوقيع والاعتماد</b><br><img src="signatures/${d.supervisor.sig}" style="max-width:240px;max-height:100px;object-fit:contain"><div>${d.supervisor.name}</div></div>`;$('previewCard').classList.remove('hidden');$('previewCard').scrollIntoView({behavior:'smooth'});}
function hidePreview(){$('previewCard').classList.add('hidden')}
function resetForm(){$('notes').value='';['assaults','power','visitors','elevators','minutes'].forEach(id=>$(id).value=0);hidePreview()}
function updateSummary(){let all=JSON.parse(localStorage.getItem('securityReports')||'[]');$('summary').innerHTML=`<div class="stat"><span>إجمالي التقارير</span><b>${all.length}</b></div><div class="stat"><span>تقارير اليوم</span><b>${all.filter(x=>x.date===$('date').value).length}</b></div>`}
renderSupervisors();updateSummary();
</script>
</body></html>
