
{% extends "base.html" %}{% block content %}
<div class="card" style="text-align:center"><h2>تقرير المشرف</h2><h3>{{sup.name}}</h3><div class="muted">{{sup.role}}</div>{% if sup.signature %}<img class="sig" src="/static/signatures/{{sup.signature}}">{% endif %}</div>
<form class="card" method="post">
<div class="grid">
<div><label>التاريخ</label><input type="date" name="report_date" value="{{today}}" required></div>
<div><label>الوردية</label><select name="shift"><option>صباحية</option><option>مسائية</option><option>ليلية</option></select></div>
<div><label>عدد الاعتداءات</label><input type="number" min="0" name="assaults" value="0"></div>
<div><label>عطل في التيار</label><input type="number" min="0" name="power_outages" value="0"></div>
<div><label>عدد الزوار</label><input type="number" min="0" name="visitors" value="0"></div>
<div><label>تعطل المصاعد</label><input type="number" min="0" name="elevator_failures" value="0"></div>
<div><label>محاضر المشرفين</label><input type="number" min="0" name="supervisor_minutes" value="0"></div>
</div>
<br><label>الملاحظات والتفاصيل</label><textarea name="notes" rows="6" placeholder="اكتب الملاحظات هنا..."></textarea><br>
<button type="submit">📄 حفظ التقرير وإنشاء PDF</button>
</form>{% endblock %}
